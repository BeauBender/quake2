// skywater.cfg plus r_rt_water 1 (TASK58, RT6): ref_metal's ray-traced water reflections, one bounce,
// blended over the water at r_rt_water_reflect 0.5 with the warp's tilt at r_rt_water_normal 0.08; other
// renderers ignore the cvars. Record it on skywater's camera path, PINS_DEMO=water.dm2 from
// "scripts/pins.sh make-demo water" (TASK40, TASK70): the pool of base1 from above its surface and from
// under it. Stateless frames: no temporal accumulation exists yet (RT7 adds it, and its cvar, off for this
// pin) and the pass draws no noise; the water warp follows the client clock as in skywater, so two records
// differ where the warp does (skywater's --bad-threshold 0.03). Judged against ref_metal itself once the
// owner accepts the look (design section 5).
// (the effect's footprint band goes here once frames exist, set with TASK133's scripts/pins.sh footprint)
set timedemo 1
set scr_conspeed 99999
set cl_showfps 0
set viewsize 100
set r_drawworld 1
set crosshair 0
set cl_gun 0
set cl_entities 0
set cl_particles 0
set cl_lights 0
set cl_blend 0
set r_fixsurfsky 0
set sw_waterwarp 1
set gl1_waterwarp 1
set r_rt_water 1
set r_rt_water_normal 0.08
set r_rt_water_reflect 0.5
set r_rt_water_show 0
