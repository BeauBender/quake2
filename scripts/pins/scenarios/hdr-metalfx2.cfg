// hdr.cfg plus r_metalfx 2 at r_metalfx_scale 0.5: MTLFXTemporalScaler on ref_metal's float16 view and frame, before the tone map (TASK196, HD4); its own reference, not compared with hdr or world-metalfx2; where the device lacks the scaler r_metalfx reads the best supported mode below; other renderers ignore the cvars and draw it as world
// r_hdr_peak 1 holds the tone map to its clamp at white on every display, so the frames do not follow a display's headroom
// frames demo1.dm2 689
set timedemo 1
set scr_conspeed 99999
set cl_showfps 0
set viewsize 100
set r_drawworld 1
set crosshair 0
set cl_gun 0
set cl_entities 0
set cl_particles 0
set cl_lights 0
set cl_blend 0
set r_hdr 1
set r_hdr_peak 1
set r_metalfx 2
set r_metalfx_scale 0.5
set r_metalfx_interp 0
