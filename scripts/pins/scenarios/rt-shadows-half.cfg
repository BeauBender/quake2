// rt-shadows.cfg plus r_rt_shadows_scale 0.5 (TASK126 slice 4, option E): ref_metal's dynamic-light shadows traced
// at one pixel of each 2 x 2 block, a quarter of the shadow rays, and upsampled to every drawn pixel by the joint
// bilateral rule (common/mtl_rtup_math.h). Each drawn pixel still works out its own lights and how much each adds;
// only a light's visibility comes from the traced pixels about it whose light set holds that light. Other
// renderers ignore the cvars. Stateless frames, as rt-shadows: no temporal accumulation (r_rt_temporal 0) and no
// noise. Its frames differ from rt-shadows's where a traced pixel's visibility stands for its block's. It
// declares no band of its own: rt-shadows carries the effect's, and this scenario is held to its own frames.
// nondeterministic: unseeded, as dlights (the engine PRNG gives the lights their radii); record it with PINS_SEED set, the same seed every time, and judge it only seeded
// frames demo1.dm2 689
set timedemo 1
set scr_conspeed 99999
set cl_showfps 0
set viewsize 100
set r_drawworld 1
set crosshair 0
set cl_gun 0
set cl_entities 0
set cl_particles 0
set cl_lights 1
set cl_blend 0
set r_rt_shadows 1
set r_rt_shadows_show 0
set r_rt_temporal 0
set r_rt_shadows_scale 0.5
