// rtprimary-world plus cl_lights 1: the dynamic lights as a term of ref_metal's Ray traced presentation (RT-primary), each in range with one shadow ray, by gl1's radius rule (TASK188 slice 3b); the muzzle-flash and explosion lights take a random radius from the engine PRNG, so record it with PINS_SEED set, as dlights; also with PINS_DEMO=demo2.dm2 PINS_EVERY=7; its records are provisional until the owner accepts the look (PM11); other renderers ignore the cvars and draw it as dlights
// frames demo1.dm2 689
// frames demo2.dm2 618
set timedemo 1
set scr_conspeed 99999
set cl_showfps 0
set viewsize 100
set r_drawworld 1
set crosshair 0
set cl_gun 0
set cl_entities 0
set cl_particles 0
set cl_lights 1
set cl_blend 0
set r_presentation 3
set r_rt_direct_exposure 0
set r_rt_direct_show 0
set r_rt_direct_seed 1
set r_rt_temporal 0
