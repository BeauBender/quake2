// hud2d.cfg plus r_scale8bittextures 1 (TASK119): the HUD pictures are in the scrap, which gl1 and metal do not scale but smooth, so a frame differs from hud2d by the smoothing only
// frames demo1.dm2 689
// the background is whatever each renderer clears to; compare a renderer with itself until measured
set timedemo 1
set scr_conspeed 99999
set cl_showfps 0
set viewsize 100
set r_drawworld 0
set r_clear 1
set crosshair 1
set cl_gun 0
set cl_entities 0
set cl_particles 0
set cl_lights 0
set cl_blend 0
set gl_polyblend 0
set r_scale8bittextures 1
