// world.cfg plus r_metalfx 1 at r_metalfx_scale 0.5: the 3D view drawn at half size and upscaled by MTLFXSpatialScaler (TASK111); other renderers ignore the cvars and draw it as world
// frames demo1.dm2 689
set timedemo 1
set scr_conspeed 99999
set cl_showfps 0
set viewsize 100
set r_drawworld 1
set crosshair 0
set cl_gun 0
set cl_entities 0
set cl_particles 0
set cl_lights 0
set cl_blend 0
set r_metalfx 1
set r_metalfx_scale 0.5
set r_metalfx_interp 0
