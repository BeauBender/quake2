// world.cfg plus r_metalfx 2 at r_metalfx_scale 0.5: MTLFXTemporalScaler with the jitter, depth and motion (TASK111); where the device lacks it r_metalfx reads the best supported mode below (1 on the VM); other renderers ignore the cvars and draw it as world
// frames demo1.dm2 689
set timedemo 1
set scr_conspeed 99999
set cl_showfps 0
set viewsize 100
set r_drawworld 1
set crosshair 0
set cl_gun 0
set cl_entities 0
set cl_particles 0
set cl_lights 0
set cl_blend 0
set r_metalfx 2
set r_metalfx_scale 0.5
set r_metalfx_interp 0
