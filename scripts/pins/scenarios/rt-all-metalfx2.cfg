// dlights.cfg plus every ray-traced effect of ref_metal (r_rt_shadows, r_rt_ao, r_rt_sun and r_rt_water, each
// at its rt-* scenario's values) and r_metalfx 2 at the default r_metalfx_scale 0: MTLFXTemporalScaler with the
// jitter, depth and motion, the effects traced at the scaler's internal size (TASK109, RT11). The default scale
// is the GPU family's default rows (1080 on Apple GPU family 9 and later, 720 below), so at the harness's 480
// lines it is the view's own size and the scaler runs as temporal anti-aliasing; r_metalfx_scale 0.5 is
// recorded from a scratch copy. r_rt_temporal 0, explicit so a later default cannot move this pin (the rt-* pins
// rely on the default of 0): RT7's history is off, so the frames differ from a still view's only by the scaler's
// jitter; where the device lacks the temporal scaler
// r_metalfx reads the best supported mode below, and without ray tracing the effects draw nothing; other
// renderers ignore the cvars and draw it as dlights
// The rt-* scenarios' lines that restate a default (r_rt_ao_range 128, r_rt_ao_min 0.4, r_rt_sunscale 0.35,
// r_rt_sunfloor 0.5, r_rt_water_normal 0.08, r_rt_water_reflect 0.5 and the four *_show 0) are left out: with
// them the record's command line was 141 words, above the engine's MAX_NUM_ARGVS of 128 (src/common/argproc.c),
// and the engine stopped with "argc > MAX_NUM_ARGVS" (tests/check-scenario-parsers.sh, t_argcount)
// Water: demo1 shows no warped water, so r_rt_water is exercised by recording this a second time on skywater's
// camera path with PINS_DEMO=water.dm2 from "scripts/pins.sh make-demo water", as rt-water is recorded.
// nondeterministic: unseeded, as dlights (the engine PRNG gives the lights their radii); record it with PINS_SEED set, the same seed every time, and judge it only seeded
// frames demo1.dm2 689
set timedemo 1
set scr_conspeed 99999
set cl_showfps 0
set viewsize 100
set r_drawworld 1
set crosshair 0
set cl_gun 0
set cl_entities 0
set cl_particles 0
set cl_lights 1
set cl_blend 0
set r_fixsurfsky 0
set sw_waterwarp 1
set gl1_waterwarp 1
set r_rt_shadows 1
set r_rt_ao 1
set r_rt_ao_seed 1
set r_rt_sun 1
set r_rt_water 1
set r_rt_temporal 0
set r_metalfx 2
set r_metalfx_interp 0
