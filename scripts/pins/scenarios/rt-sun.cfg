// world.cfg plus r_rt_sun 1 (TASK56, RT4): ref_metal's ray-traced sun and sky shadow, one ray a dim world pixel
// toward the sun (scripts/rt/sun-angles.txt, else r_rt_sun_angles at its default 55 45, which a scenario value
// cannot spell); a pixel whose ray reaches the sky takes
// sky_color x r_rt_sunscale 0.35 x N.L where its lightmap is below r_rt_sunfloor 0.5; a map under 2 % sky draws as
// world; other renderers ignore the cvars. Stateless frames: no temporal accumulation exists yet (RT7 adds it, and
// its cvar, off for this pin) and the pass draws no noise (one ray in a fixed direction), so there is no seed to
// fix and every frame is the same on every run. No footprint band yet: it is set, with its companion, when the
// owner accepts the look and the pin is recorded against ref_metal itself (design section 5, INFORM11).
set timedemo 1
set scr_conspeed 99999
set cl_showfps 0
set viewsize 100
set r_drawworld 1
set crosshair 0
set cl_gun 0
set cl_entities 0
set cl_particles 0
set cl_lights 0
set cl_blend 0
set r_rt_sun 1
set r_rt_sunscale 0.35
set r_rt_sunfloor 0.5
set r_rt_sun_show 0
set r_rt_temporal 0
