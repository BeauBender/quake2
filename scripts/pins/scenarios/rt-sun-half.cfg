// rt-sun.cfg plus r_rt_sun_scale 0.5 (TASK126 slice 3, option E): ref_metal's ray-traced sun traced at one
// pixel of each 2 x 2 block, a quarter of the rays, and upsampled to every drawn pixel by the joint bilateral
// rule (common/mtl_rtup_math.h), each pixel's light composed with its own angle to the sun; other renderers
// ignore the cvars. Stateless frames, as rt-sun: no temporal accumulation (r_rt_temporal 0) and one ray in a
// fixed direction, so every frame is the same on every run. Its frames differ from rt-sun's where a traced
// pixel's visibility stands for its block's.
set timedemo 1
set scr_conspeed 99999
set cl_showfps 0
set viewsize 100
set r_drawworld 1
set crosshair 0
set cl_gun 0
set cl_entities 0
set cl_particles 0
set cl_lights 0
set cl_blend 0
set r_rt_sun 1
set r_rt_sunscale 0.35
set r_rt_sunfloor 0.5
set r_rt_sun_show 0
set r_rt_temporal 0
set r_rt_sun_scale 0.5
