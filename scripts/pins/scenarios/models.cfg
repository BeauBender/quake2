// the world plus entities: alias models with frame interpolation, sprites, beams, the view weapon
// nondeterministic: temporary-entity explosions take a random yaw and frame from the engine PRNG;
// soft run to run (TASK39, five pairs): one frame differs, worst score 0.000446, worst bad
// fraction 0.000973; accept at the default thresholds; recorded with PINS_SEED set every run is
// identical (TASK45, soft) and compares at --threshold 0 --bad-threshold 0
set timedemo 1
set scr_conspeed 99999
set cl_showfps 0
set viewsize 100
set r_drawworld 1
set crosshair 0
set cl_gun 2
set cl_entities 1
set cl_particles 0
set cl_lights 0
set cl_blend 0
