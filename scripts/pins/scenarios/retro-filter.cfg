// retro.cfg plus r_retro_filter 1: the 2 x 2 box output filter over the dithered pixels (TASK184); other renderers ignore the cvars and draw it as world
// frames demo1.dm2 689
set timedemo 1
set scr_conspeed 99999
set cl_showfps 0
set viewsize 100
set r_drawworld 1
set crosshair 0
set cl_gun 0
set cl_entities 0
set cl_particles 0
set cl_lights 0
set cl_blend 0
set r_presentation 2
set r_retro_filter 1
set r_retro_gamma 0
