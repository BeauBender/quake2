// rtprimary-weapon with r_rt_gunshadow 1: the view weapon still left out of the ray-traced scene while r_rt_direct_models traces the models (rm_rtm_gunshadow), so it casts no shadow and no ray from its own pixels meets it; its frames equal rtprimary-weapon's byte for byte (TASK191 slice 3, its review); entities need PINS_SEED, as models does; other renderers ignore the cvars and draw it as models with the gun
// frames demo1.dm2 689
set timedemo 1
set scr_conspeed 99999
set cl_showfps 0
set viewsize 100
set r_drawworld 1
set crosshair 0
set cl_gun 1
set cl_entities 1
set cl_particles 0
set cl_lights 0
set cl_blend 0
set r_presentation 3
set r_rt_direct_exposure 0
set r_rt_direct_show 0
set r_rt_direct_seed 1
set r_rt_temporal 0
set r_rt_direct_models 1
set r_rt_gunshadow 1
