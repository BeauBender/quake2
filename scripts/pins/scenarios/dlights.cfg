// world.cfg plus cl_lights 1: dynamic lights on the world's lightmaps (TASK91, ref_metal N8); with
// gl1_flashblend 1 the flash blobs instead. Record it twice: at the default demo1.dm2 and cadence, and
// with PINS_DEMO=demo2.dm2 PINS_EVERY=7 (89 frames), whose frames 51, 61, 63, 67 and 69 show an
// animated lightstyle and no light from the PRNG; with gl1_dynamic 0 (no lightstyle update) 61, 67
// and 69 go over the values below, 51 and 63 move by one level only
// nondeterministic: unseeded, muzzle-flash and explosion lights take a random radius from the engine
// PRNG; gl1-metal run to run unseeded (TASK91, five records, ten pairs, each demo): demo1.dm2 worst
// score 0.009399, worst bad fraction 0.176774, demo2.dm2 every 7th worst score 0.012701, worst bad
// fraction 0.305941; so record it with PINS_SEED set, the same seed for reference and candidate:
// then every gl1-metal run is identical (TASK91, PINS_SEED=1, two records of each demo, byte for
// byte) and metal compares at --threshold 0.005 --bad-threshold 0.001 on every frame of both (worst
// score 0.000001, worst bad fraction 0.000013); an unseeded record is not judged
set timedemo 1
set scr_conspeed 99999
set cl_showfps 0
set viewsize 100
set r_drawworld 1
set crosshair 0
set cl_gun 0
set cl_entities 0
set cl_particles 0
set cl_lights 1
set cl_blend 0
