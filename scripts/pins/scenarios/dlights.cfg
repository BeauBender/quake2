// world.cfg plus cl_lights 1: dynamic lights on the world's lightmaps (TASK91, ref_metal N8); with
// gl1_flashblend 1 the flash blobs instead. Record it twice: at the default demo1.dm2 and cadence, and
// with PINS_DEMO=demo2.dm2 PINS_EVERY=7 (89 frames), whose frames 51, 61, 63, 67 and 69 show an
// animated lightstyle and no light from the PRNG (they are judged at score 0, as in world)
// nondeterministic: muzzle-flash and explosion lights take a random radius from the engine PRNG;
// gl1-metal run to run (TASK91, five records, ten pairs, each demo): demo1.dm2 worst score 0.009399,
// worst bad fraction 0.176774, demo2.dm2 every 7th worst score 0.012701, worst bad fraction 0.305941;
// accept at --threshold 0.02 --bad-threshold 0.5; with the PRNG fixed (a scratch engine seeding it with
// randk_seed_fixed, as PINS_SEED does beside a trace) every gl1-metal run is identical and metal
// compares at --threshold 0.005 --bad-threshold 0.001 on every frame of both
set timedemo 1
set scr_conspeed 99999
set cl_showfps 0
set viewsize 100
set r_drawworld 1
set crosshair 0
set cl_gun 0
set cl_entities 0
set cl_particles 0
set cl_lights 1
set cl_blend 0
