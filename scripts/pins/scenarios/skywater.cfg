// world surfaces, sky and warped water only: no entities, particles, dynamic lights or screen blend;
// record with the demo and frames named in docs/plans/metal-port-harness.md (sky and water)
set timedemo 1
set scr_conspeed 99999
set cl_showfps 0
set viewsize 100
set r_drawworld 1
set crosshair 0
set cl_gun 0
set cl_entities 0
set cl_particles 0
set cl_lights 0
set cl_blend 0
set r_fixsurfsky 0
set sw_waterwarp 1
set gl1_waterwarp 1
