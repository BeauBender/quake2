// world surfaces, sky and warped water only: no entities, particles, dynamic lights or screen blend,
// with the sky and water-warp settings fixed. On the owner's data (TASK40, soft) demo1.dm2, the
// default, shows the sky in frame 21 at PINS_EVERY 30; neither demo showed warped water on the
// frames looked at (docs/plans/metal-port-harness.md). For water, make a demo once with
// "scripts/pins.sh make-demo water" and record with PINS_DEMO=water.dm2 (TASK70). make-demo
// fails a demo outside the message range water.cfg states; from a demo in range, at PINS_EVERY
// 30, the first half of the frames show the pool of base1 from just above its surface and the
// second half from under it (4 frames, 2 and 2, in every record made so far)
// nondeterministic with water.dm2: the water warp follows the client clock, which in a timedemo
// moves with the host only when a frame takes over 100 ms; soft (TASK70): 27 pairs of records at
// load 142 to 197 compared at score 0, two records with the engine stalled gave worst score
// 0.001776, worst bad fraction 0.020898; accept at --bad-threshold 0.03
set timedemo 1
set scr_conspeed 99999
set cl_showfps 0
set viewsize 100
set r_drawworld 1
set crosshair 0
set cl_gun 0
set cl_entities 0
set cl_particles 0
set cl_lights 0
set cl_blend 0
set r_fixsurfsky 0
set sw_waterwarp 1
set gl1_waterwarp 1
