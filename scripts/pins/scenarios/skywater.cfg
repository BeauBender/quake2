// world surfaces, sky and warped water only: no entities, particles, dynamic lights or screen blend,
// with the sky and water-warp settings fixed. On the owner's data (TASK40, soft) demo1.dm2, the
// default, shows the sky in frame 21 at PINS_EVERY 30; neither demo showed warped water on the
// frames looked at (docs/plans/metal-port-harness.md). For water, make a demo once with
// "scripts/pins.sh make-demo water" and record with PINS_DEMO=water.dm2 (TASK70): at PINS_EVERY 30
// frames 0 to 2 show the pool of base1 from just above its surface, frames 3 to 5 from under it
set timedemo 1
set scr_conspeed 99999
set cl_showfps 0
set viewsize 100
set r_drawworld 1
set crosshair 0
set cl_gun 0
set cl_entities 0
set cl_particles 0
set cl_lights 0
set cl_blend 0
set r_fixsurfsky 0
set sw_waterwarp 1
set gl1_waterwarp 1
