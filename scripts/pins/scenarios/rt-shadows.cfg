// footprint darker 0..0.12
// dlights.cfg plus r_rt_shadows 1 (TASK55, RT3): the dynamic lights of the world's lightmaps added in ref_metal's resolve
// with a ray-traced shadow each (the four that add the most at a pixel); other renderers ignore the cvar.
// Stateless frames: no temporal accumulation exists yet (RT7 adds it, and its cvar, off for this pin) and the
// pass draws no noise. Judged against ref_metal itself once the owner accepts the look (design section 5).
// nondeterministic: unseeded, as dlights (the engine PRNG gives the lights their radii); record it with PINS_SEED set, the same seed every time, and judge it only seeded
// frames demo1.dm2 689
set timedemo 1
set scr_conspeed 99999
set cl_showfps 0
set viewsize 100
set r_drawworld 1
set crosshair 0
set cl_gun 0
set cl_entities 0
set cl_particles 0
set cl_lights 1
set cl_blend 0
set r_rt_shadows 1
set r_rt_shadows_show 0
set r_rt_temporal 0
