// rt-all-metalfx2.cfg in section 2's configuration H (TASK126 slice 6, a hybrid of A and E): every ray-traced
// effect of ref_metal on at its rt-* scenario's values, MTLFXTemporalScaler at r_metalfx_scale 0.5 (the 3D
// frame rasterized at half the view's width and height) and every effect scale at 1/2 of that internal size
// (r_rt_shadows_scale, r_rt_sun_scale and r_rt_water_scale 0.5; r_rt_ao_scale 0.5, its default, set so a
// later default cannot move this pin): each effect traces a sixteenth of the view's pixels and is upsampled
// to the internal size, which the scaler upscales. The scales apply to the size the effects run at, the
// scaler's input here, so the hybrid needs no code of its own. r_rt_temporal 0 and r_metalfx_interp 0, as
// rt-all-metalfx2. Where the device lacks the temporal scaler r_metalfx reads the best supported mode below;
// without ray tracing the effects draw nothing; other renderers ignore the cvars and draw it as dlights.
// Water: demo1 shows no warped water, so r_rt_water is exercised by recording this a second time on skywater's
// camera path with PINS_DEMO=water.dm2, as rt-all-metalfx2 is.
// nondeterministic: unseeded, as dlights (the engine PRNG gives the lights their radii); record it with PINS_SEED set, the same seed every time, and judge it only seeded
// frames demo1.dm2 689
set timedemo 1
set scr_conspeed 99999
set cl_showfps 0
set viewsize 100
set r_drawworld 1
set crosshair 0
set cl_gun 0
set cl_entities 0
set cl_particles 0
set cl_lights 1
set cl_blend 0
set r_fixsurfsky 0
set sw_waterwarp 1
set gl1_waterwarp 1
set r_rt_shadows 1
set r_rt_ao 1
set r_rt_ao_seed 1
set r_rt_sun 1
set r_rt_water 1
set r_rt_temporal 0
set r_metalfx 2
set r_metalfx_interp 0
set r_metalfx_scale 0.5
set r_rt_shadows_scale 0.5
set r_rt_sun_scale 0.5
set r_rt_water_scale 0.5
set r_rt_ao_scale 0.5
