// hud2d.cfg plus metal_2d_sharp 1: the sharp-bilinear sample of the 2D pictures in ref_metal (TASK119); the other renderers ignore the cvar, so they draw it as hud2d
// the background is whatever each renderer clears to; compare a renderer with itself until measured
// frames demo1.dm2 689
set timedemo 1
set scr_conspeed 99999
set cl_showfps 0
set viewsize 100
set r_drawworld 0
set r_clear 1
set crosshair 1
set cl_gun 0
set cl_entities 0
set cl_particles 0
set cl_lights 0
set cl_blend 0
set gl_polyblend 0
set metal_2d_sharp 1
