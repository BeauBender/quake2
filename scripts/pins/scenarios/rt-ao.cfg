// footprint darker 0..0.5
// world.cfg plus r_rt_ao 1 (TASK57, RT5): ref_metal's ray-traced ambient occlusion, the world's lightmap term
// darkened by two hemisphere rays (r_rt_ao_rays, default 2) a traced pixel, traced at half the view's size
// (r_rt_ao_scale, default 0.5) and upsampled (r_rt_ao_range 128, clamped at r_rt_ao_min 0.4); other renderers ignore
// the cvars. Stateless frames: no temporal accumulation exists yet (RT7 adds it, and its cvar, off for this pin)
// and the noise is fixed at step 1 (r_rt_ao_seed 1), so every frame draws the same pattern on every run. Judged
// against ref_metal itself once the owner accepts the look (design section 5).
// frames demo1.dm2 689
set timedemo 1
set scr_conspeed 99999
set cl_showfps 0
set viewsize 100
set r_drawworld 1
set crosshair 0
set cl_gun 0
set cl_entities 0
set cl_particles 0
set cl_lights 0
set cl_blend 0
set r_rt_ao 1
set r_rt_ao_range 128
set r_rt_ao_min 0.4
set r_rt_ao_seed 1
set r_rt_ao_show 0
