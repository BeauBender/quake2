// rt-water.cfg on the screen-space path at a third of the size (TASK126 slice 5, option E): r_rt_water_hits 0,
// so every pixel is traced and a hit is taken from the picture, r_rt_water_scale 0.33, so one pixel of each
// 3 x 3 block is traced, and r_rt_temporal 0.9, so the water's 3 x 3 blur runs at the traced size before the
// upsample. The water keeps no history and no other ray-traced effect is on, so the frames are still
// stateless: the blur reads the frame's own reflections only. Other renderers ignore the cvars. Record it on
// skywater's camera path (PINS_DEMO=water.dm2), as rt-water. Its frames differ from rt-water's where a traced
// pixel's reflection stands for its block's. It declares no band of its own: rt-water carries the effect's,
// and this scenario is held to its own frames.
// frames demo1.dm2 689
set timedemo 1
set scr_conspeed 99999
set cl_showfps 0
set viewsize 100
set r_drawworld 1
set crosshair 0
set cl_gun 0
set cl_entities 0
set cl_particles 0
set cl_lights 0
set cl_blend 0
set r_fixsurfsky 0
set sw_waterwarp 1
set gl1_waterwarp 1
set r_rt_water 1
set r_rt_water_normal 0.08
set r_rt_water_reflect 0.5
set r_rt_water_show 0
set r_rt_water_hits 0
set r_rt_temporal 0.9
set r_rt_water_scale 0.33
// footprint changed 0..0.08
