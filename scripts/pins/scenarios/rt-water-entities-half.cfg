// rt-water-entities.cfg plus r_rt_water_scale 0.5 (TASK126 slice 5, option E): the brush entities and the alias
// models, which the reflection rays meet, with the reflections traced at one pixel of each 2 x 2 block and
// upsampled to every drawn pixel on the water's class, as rt-water-half. Record it on skywater's camera path
// (PINS_DEMO=water.dm2), as rt-water-entities. It declares no band of its own: rt-water carries the effect's, and
// this scenario is held to its own frames.
// nondeterministic: unseeded, as models (temporary-entity explosions take a random yaw and frame from the engine
// PRNG); record it with PINS_SEED set, the same seed every time, and judge it only seeded
// frames demo1.dm2 689
set timedemo 1
set scr_conspeed 99999
set cl_showfps 0
set viewsize 100
set r_drawworld 1
set crosshair 0
set cl_gun 0
set cl_entities 1
set cl_particles 0
set cl_lights 0
set cl_blend 0
set r_fixsurfsky 0
set sw_waterwarp 1
set gl1_waterwarp 1
set r_rt_water 1
set r_rt_water_normal 0.08
set r_rt_water_reflect 0.5
set r_rt_water_show 0
set r_rt_temporal 0
set r_rt_water_scale 0.5
