// footprint darker 0..0.12
// rt-shadows.cfg with cl_entities 1 (TASK55, RT3): the brush entities (doors, lifts, trains, whose surfaces gl1 lights in
// their model's space with the light's world origin) and the alias models (lit by the light at their position, never
// by the pass) in the double-count check; the view weapon left out as in dlights.
// nondeterministic: unseeded, as dlights (the engine PRNG gives the lights their radii, the explosions their yaw and
// frame); record it with PINS_SEED set, the same seed every time, and judge it only seeded
// frames demo1.dm2 689
set timedemo 1
set scr_conspeed 99999
set cl_showfps 0
set viewsize 100
set r_drawworld 1
set crosshair 0
set cl_gun 0
set cl_entities 1
set cl_particles 0
set cl_lights 1
set cl_blend 0
set r_rt_shadows 1
set r_rt_shadows_show 0
set r_rt_temporal 0
