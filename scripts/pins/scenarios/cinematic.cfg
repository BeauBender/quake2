// a cinematic (.cin): one RGBA upload per frame through Draw_StretchRaw, no world;
// record with PINS_DEMO naming a cinematic under video/, for example PINS_DEMO=idlog.cin
set timedemo 1
set scr_conspeed 99999
set cl_showfps 0
set viewsize 100
set r_drawworld 1
set crosshair 0
set cl_gun 0
set cl_entities 0
set cl_particles 0
set cl_lights 0
set cl_blend 0
set cin_force43 1
