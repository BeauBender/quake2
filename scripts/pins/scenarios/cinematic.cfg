// a cinematic (.cin): Draw_StretchRaw of the decoded picture on every rendered frame, no world;
// record with PINS_DEMO naming a cinematic under video/: PINS_DEMO=idlog.cin PINS_EVERY=7
// (captures every 7th cinematic frame, 12 frames; TASK40)
set timedemo 1
set scr_conspeed 99999
set cl_showfps 0
set viewsize 100
set r_drawworld 1
set crosshair 0
set cl_gun 0
set cl_entities 0
set cl_particles 0
set cl_lights 0
set cl_blend 0
set cin_force43 1
