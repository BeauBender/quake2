// world.cfg plus r_hdr 1: ref_metal's float16 frame target, read back as its SDR fallback (each channel clamped to white, in 8 bits; TASK196 HD2); its own reference, not compared with world; other renderers ignore the cvar and draw it as world
// frames demo1.dm2 689
set timedemo 1
set scr_conspeed 99999
set cl_showfps 0
set viewsize 100
set r_drawworld 1
set crosshair 0
set cl_gun 0
set cl_entities 0
set cl_particles 0
set cl_lights 0
set cl_blend 0
set r_hdr 1
