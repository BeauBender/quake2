// rt-water.cfg plus r_rt_water_scale 0.5 (TASK126 slice 5, option E): ref_metal's water reflections traced at one
// pixel of each 2 x 2 block, a quarter of the reflection rays, and upsampled to every drawn pixel by the joint
// bilateral rule (common/mtl_rtup_math.h) on the water's class: each water pixel takes the reflection of the traced
// pixels next to it that found water of its own kind with a reflection, on its own surface. The blend over the water
// and the translucent faces read it as at scale 1. Other renderers ignore the cvars. Record it on skywater's camera
// path (PINS_DEMO=water.dm2), as rt-water. Stateless frames, as rt-water: no temporal accumulation (r_rt_temporal 0)
// and no noise. Its frames differ from rt-water's where a traced pixel's reflection stands for its block's. It
// declares no band of its own: rt-water carries the effect's, and this scenario is held to its own frames.
// frames demo1.dm2 689
set timedemo 1
set scr_conspeed 99999
set cl_showfps 0
set viewsize 100
set r_drawworld 1
set crosshair 0
set cl_gun 0
set cl_entities 0
set cl_particles 0
set cl_lights 0
set cl_blend 0
set r_fixsurfsky 0
set sw_waterwarp 1
set gl1_waterwarp 1
set r_rt_water 1
set r_rt_water_normal 0.08
set r_rt_water_reflect 0.5
set r_rt_water_show 0
set r_rt_temporal 0
set r_rt_water_scale 0.5
