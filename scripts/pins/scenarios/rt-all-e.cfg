// rt-all-metalfx2.cfg in section 2's configuration E (TASK126 slice 6, option E): every ray-traced effect of
// ref_metal on at its rt-* scenario's values, no scaler (r_metalfx 0) and every effect scale at 1/2
// (r_rt_shadows_scale, r_rt_sun_scale and r_rt_water_scale 0.5; r_rt_ao_scale 0.5, its default, set so a
// later default cannot move this pin): each effect traced at one pixel of each 2 x 2 block of the drawn view
// and upsampled to every drawn pixel. r_rt_temporal 0, as rt-all-metalfx2: no history, so with the seed fixed
// every run draws the same frames. Without ray tracing the effects draw nothing and the scales do nothing;
// other renderers ignore the cvars and draw it as dlights. The lines restating a default are left out as in
// rt-all-metalfx2, which keeps the command line under MAX_NUM_ARGVS.
// Water: demo1 shows no warped water, so r_rt_water is exercised by recording this a second time on skywater's
// camera path with PINS_DEMO=water.dm2, as rt-all-metalfx2 is.
// nondeterministic: unseeded, as dlights (the engine PRNG gives the lights their radii); record it with PINS_SEED set, the same seed every time, and judge it only seeded
// frames demo1.dm2 689
set timedemo 1
set scr_conspeed 99999
set cl_showfps 0
set viewsize 100
set r_drawworld 1
set crosshair 0
set cl_gun 0
set cl_entities 0
set cl_particles 0
set cl_lights 1
set cl_blend 0
set r_fixsurfsky 0
set sw_waterwarp 1
set gl1_waterwarp 1
set r_rt_shadows 1
set r_rt_ao 1
set r_rt_ao_seed 1
set r_rt_sun 1
set r_rt_water 1
set r_rt_temporal 0
set r_metalfx 0
set r_rt_shadows_scale 0.5
set r_rt_sun_scale 0.5
set r_rt_water_scale 0.5
set r_rt_ao_scale 0.5
