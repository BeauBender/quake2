// footprint darker 0..0.5
// rt-ao.cfg with cl_entities 1 (TASK57, RT5): the brush entities (doors, lifts, trains) and the alias models
// (monsters, players, items), which AO rays meet, so they darken the world beside them, and which the pass never
// darkens itself (it scales the lightmap term only); the view weapon left out as in world, and passed by AO rays.
// nondeterministic: unseeded, as models (temporary-entity explosions take a random yaw and frame from the engine
// PRNG); record it with PINS_SEED set, the same seed every time, and judge it only seeded
set timedemo 1
set scr_conspeed 99999
set cl_showfps 0
set viewsize 100
set r_drawworld 1
set crosshair 0
set cl_gun 0
set cl_entities 1
set cl_particles 0
set cl_lights 0
set cl_blend 0
set r_rt_ao 1
set r_rt_ao_range 128
set r_rt_ao_min 0.4
set r_rt_ao_seed 1
set r_rt_ao_show 0
