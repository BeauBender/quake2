// rtprimary-world with r_rt_temporal 0.9: RT-primary's light accumulated over the views and then its 5 x 5 edge-aware filter, on the summed light, full at one sample and none from 16 (TASK190 slices 1 and 2), and the water reflections' 3 x 3 blur where water is in view; the sky ray's noise fixed by r_rt_direct_seed 1, so the frames are the same run to run; provisional until the owner accepts the look (PM11); other renderers ignore the cvars and draw it as world
// frames demo1.dm2 689
set timedemo 1
set scr_conspeed 99999
set cl_showfps 0
set viewsize 100
set r_drawworld 1
set crosshair 0
set cl_gun 0
set cl_entities 0
set cl_particles 0
set cl_lights 0
set cl_blend 0
set r_presentation 3
set r_rt_direct_exposure 0
set r_rt_direct_show 0
set r_rt_direct_seed 1
set r_rt_temporal 0.9
