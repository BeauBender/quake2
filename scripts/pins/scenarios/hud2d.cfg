// the 2D path only: status bar, crosshair and console text, with the world and all entities off
// the background is whatever each renderer clears to; compare a renderer with itself until measured
set timedemo 1
set scr_conspeed 99999
set cl_showfps 0
set viewsize 100
set r_drawworld 0
set r_clear 1
set crosshair 1
set cl_gun 0
set cl_entities 0
set cl_particles 0
set cl_lights 0
set cl_blend 0
