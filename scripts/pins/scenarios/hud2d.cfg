// the 2D path only: status bar, crosshair and console text, with the world and all entities off
// the background is whatever each renderer clears to; compare a renderer with itself until measured
set timedemo 1
set scr_conspeed 99999
set cl_showfps 0
set viewsize 100
set r_drawworld 0
set r_clear 1
set crosshair 1
set cl_gun 0
set cl_entities 0
set cl_particles 0
set cl_lights 0
set cl_blend 0
// cl_blend 0 clears the colour of the screen blend but not its alpha, so a pickup still darkens
// the screen; gl_polyblend 0 keeps that 3D quad out of the GL renderers (soft has no such cvar and
// still darkens), and the flash is judged in a 3D scenario (TASK82)
set gl_polyblend 0
