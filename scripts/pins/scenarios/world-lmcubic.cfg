// world.cfg plus metal_lightmap_filter 1: the cubic B-spline lightmap filter of ref_metal (TASK120); the other renderers ignore the cvar, so they draw it as world
// frames demo1.dm2 689
set timedemo 1
set scr_conspeed 99999
set cl_showfps 0
set viewsize 100
set r_drawworld 1
set crosshair 0
set cl_gun 0
set cl_entities 0
set cl_particles 0
set cl_lights 0
set cl_blend 0
set metal_lightmap_filter 1
