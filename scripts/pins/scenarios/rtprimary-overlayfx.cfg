// rtprimary-world at r_metalfx_scale 0.5 with the player's r_metalfx 0: RT-primary's overlay reads r_metalfx as 2, so the mode traces at half the view's size and MTLFXTemporalScaler, with the jitter, depth and motion, upscales it to the view's (TASK190 slice 3); at the default scale the harness's 480 lines are the view's own size and the mode runs no scaler of its own, which keeps every other rtprimary pin; where the device lacks the temporal scaler the overlay reads off and the view is traced at the full size; the sky ray's noise fixed by r_rt_direct_seed 1; provisional until the owner accepts the look (PM11); other renderers ignore the cvars and draw it as world
// frames demo1.dm2 689
set timedemo 1
set scr_conspeed 99999
set cl_showfps 0
set viewsize 100
set r_drawworld 1
set crosshair 0
set cl_gun 0
set cl_entities 0
set cl_particles 0
set cl_lights 0
set cl_blend 0
set r_presentation 3
set r_rt_direct_exposure 0
set r_rt_direct_show 0
set r_rt_direct_seed 1
set r_rt_temporal 0
set r_metalfx 0
set r_metalfx_scale 0.5
set r_metalfx_interp 0
