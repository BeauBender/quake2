// rtprimary-weapon with r_rt_temporal 0.95: the rastered alias models and the view weapon lit by RT-primary's traced light and accumulated over the frames with the world's light, each model pixel's traced light blended with its history where the motion vector says it was (the weapon's by its own projection), under a key of its own, then put through the stock model colour, the glow pulse and the minlight floor of each frame (TASK191 slice 4, r_rt_direct_models 1, the default); the world's light accumulated and filtered as rtprimary-denoise's; entities need PINS_SEED, as models does; seeded; other renderers ignore the cvars and draw it as models with the gun
// frames demo1.dm2 689
set timedemo 1
set scr_conspeed 99999
set cl_showfps 0
set viewsize 100
set r_drawworld 1
set crosshair 0
set cl_gun 1
set cl_entities 1
set cl_particles 0
set cl_lights 0
set cl_blend 0
set r_presentation 3
set r_rt_direct_exposure 0
set r_rt_direct_show 0
set r_rt_direct_seed 1
set r_rt_temporal 0.95
set r_rt_direct_models 1
