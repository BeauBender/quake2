// rtprimary-world.cfg plus r_metalfx 2 at the default r_metalfx_scale 0: ref_metal's Ray traced presentation
// (RT-primary) traced at the scaler's internal size and upscaled by MTLFXTemporalScaler with the jitter, depth
// and motion (TASK109, RT11). The default scale is the GPU family's default rows (1080 on Apple GPU family 9
// and later, 720 below), so at the harness's 480 lines it is the view's own size and the scaler runs as
// temporal anti-aliasing; r_metalfx_scale 0.5 is recorded from a scratch copy. The exposure is fitted once at
// the map's load, as rtprimary-world; where the device lacks the temporal scaler r_metalfx reads the best
// supported mode below; its records are provisional until the owner accepts the look (PM11); other
// renderers ignore the cvars and draw it as world
// frames demo1.dm2 689
set timedemo 1
set scr_conspeed 99999
set cl_showfps 0
set viewsize 100
set r_drawworld 1
set crosshair 0
set cl_gun 0
set cl_entities 0
set cl_particles 0
set cl_lights 0
set cl_blend 0
set r_presentation 3
set r_rt_direct_exposure 0
set r_rt_direct_show 0
set r_rt_temporal 0
set r_metalfx 2
set r_metalfx_interp 0
