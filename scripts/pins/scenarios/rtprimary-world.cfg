// world.cfg plus r_presentation 3: ref_metal's Ray traced presentation (RT-primary), the lightmap off at the visible world surface and the direct light of the map's light entities in its place, one shadow ray a light, the 16 visible lights a pixel, the exposure fitted once at the map's load from a sample of its luxels (so the frames are deterministic); its records are provisional until the owner accepts the look (TASK188, PM6, PM11); other renderers ignore the cvars and draw it as world
// frames demo1.dm2 689
set timedemo 1
set scr_conspeed 99999
set cl_showfps 0
set viewsize 100
set r_drawworld 1
set crosshair 0
set cl_gun 0
set cl_entities 0
set cl_particles 0
set cl_lights 0
set cl_blend 0
set r_presentation 3
set r_rt_direct_exposure 0
set r_rt_direct_show 0
