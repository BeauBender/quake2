// everything on: particles, dynamic lights and the screen blend over world and entities
// nondeterministic: particle effects draw on the engine PRNG, which is seeded from OS entropy;
// accept at a looser threshold until a fixed seed exists (docs/plans/refapi-record-replay.md)
set timedemo 1
set scr_conspeed 99999
set cl_showfps 0
set viewsize 100
set r_drawworld 1
set crosshair 0
set cl_gun 2
set cl_entities 1
set cl_particles 1
set cl_lights 1
set cl_blend 1
