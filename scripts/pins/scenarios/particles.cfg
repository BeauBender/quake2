// everything on: particles, dynamic lights and the screen blend over world and entities
// nondeterministic: particle effects draw on the engine PRNG, which is seeded from OS entropy;
// soft run to run (TASK39, five pairs): worst score 0.011556, worst bad fraction 0.172061;
// accept at --threshold 0.02 --bad-threshold 0.25; recorded with PINS_SEED set every run is identical
// (TASK45, soft and gl1-metal) and compares at --threshold 0 --bad-threshold 0, as a replay does
set timedemo 1
set scr_conspeed 99999
set cl_showfps 0
set viewsize 100
set r_drawworld 1
set crosshair 0
set cl_gun 2
set cl_entities 1
set cl_particles 1
set cl_lights 1
set cl_blend 1
