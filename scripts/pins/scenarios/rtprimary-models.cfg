// rtprimary-world plus the entities and the view weapon (cl_entities 1, cl_gun 2, as models): the alias models and the view weapon of ref_metal's Ray traced presentation (RT-primary) lit by one traced probe each, the light a world pixel takes at the point below the model where R_LightPoint reads the lightmap, in that sample's place (TASK191, r_rt_direct_models 1, the default), so a model in a traced shadow or light pool matches the floor it stands on; translucent, fullbright and shell models keep the stock light; the temporary entities take a random yaw and frame from the engine PRNG, so record it with PINS_SEED set, as models; its records are provisional until the owner accepts the look (PM11); other renderers ignore the cvars and draw it as models
// frames demo1.dm2 689
set timedemo 1
set scr_conspeed 99999
set cl_showfps 0
set viewsize 100
set r_drawworld 1
set crosshair 0
set cl_gun 2
set cl_entities 1
set cl_particles 0
set cl_lights 0
set cl_blend 0
set r_presentation 3
set r_rt_direct_exposure 0
set r_rt_direct_show 0
set r_rt_direct_seed 1
set r_rt_temporal 0
set r_rt_direct_models 1
