// rtprimary-world plus entities (cl_entities 1, no view weapon): the rastered alias models lit by RT-primary's traced light at their own point and normal, the world's terms in gl1's model colour (TASK191 slice 2, r_rt_direct_models 1, the default); glowing, minlight, fullbright and depth-hacked models stay stock-lit; entities need PINS_SEED, as models does; other renderers ignore the cvars and draw it as models without the gun
// frames demo1.dm2 689
set timedemo 1
set scr_conspeed 99999
set cl_showfps 0
set viewsize 100
set r_drawworld 1
set crosshair 0
set cl_gun 0
set cl_entities 1
set cl_particles 0
set cl_lights 0
set cl_blend 0
set r_presentation 3
set r_rt_direct_exposure 0
set r_rt_direct_show 0
set r_rt_direct_seed 1
set r_rt_temporal 0
set r_rt_direct_models 1
