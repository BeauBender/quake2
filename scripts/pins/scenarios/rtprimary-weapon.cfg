// rtprimary-models with the view weapon (cl_gun 1): the weapon rastered under RT-primary with its depth hack and lit by traced light at its own point and normal, shaded per pixel, in the shadows and the light the demo's walk passes through, and at the pull-back point where it pokes into a wall; glowing and minlight models traced through their tag; the weapon casts no shadow (TASK191 slice 3, r_rt_direct_models 1, the default); entities need PINS_SEED, as models does; other renderers ignore the cvars and draw it as models with the gun
// frames demo1.dm2 689
set timedemo 1
set scr_conspeed 99999
set cl_showfps 0
set viewsize 100
set r_drawworld 1
set crosshair 0
set cl_gun 1
set cl_entities 1
set cl_particles 0
set cl_lights 0
set cl_blend 0
set r_presentation 3
set r_rt_direct_exposure 0
set r_rt_direct_show 0
set r_rt_direct_seed 1
set r_rt_temporal 0
set r_rt_direct_models 1
