// scripts/pins/demos/water.cfg -- TASK70: records demos/water.dm2, a demo that
// looks at a water surface, for the skywater scenario. Run it with
// scripts/pins.sh make-demo water. The driver copies it beside the binary,
// execs it in a local single-player game and checks the demo it leaves.
// Only commands that exist in src/ may appear here (the driver's selftest
// checks), and no semicolon or quote in a comment: the engine splits on them.
//
// wait holds the rest of this script for one frame of at least 16 ms
// (Cbuf_Execute), so a wait count is a lower bound on time, not a count of
// server frames, and nothing in the engine holds a script for a number of
// server frames. The length of the demo therefore follows the pace of the
// host: 98 to 100 messages here, 143 to 148 on another host, 159 under a
// 3840 by 2160 soft renderer. What does not follow the pace is where the
// move under water falls in the demo. Both holds are counted in waits, so
// while a wait lasts about the same everywhere in the run, the move falls at
// nearly the same fraction of the rendered frames whatever their number is:
// 0.38 to 0.40 as measured (frame 36 of 95, 41 of 103 at 2560 by 1440, 61 of
// 154 at 3840 by 2160), from 220 waits before it and 370 after. The driver
// does not take that on trust: it reads the demo and finds the frame of the
// move (the last frame message that carries the pmove origin), and fails the
// run when that is not on the rendered frames of the move line below. A demo
// of N messages renders N-5 frames, and a capture of skywater at PINS_EVERY
// 30 falls on every 30th rendered frame from frame 0, so a move on frames 33
// to 57 sits between the second capture (frame 30) and the third (frame 60)
// with 3 frames to spare at each edge. The captures at frames 0 and 30 look
// from above the water and those from frame 60 on look from under it.
//
// The message range below is 96 to 147, and the arithmetic is: at 96
// messages there are 91 frames, so the captures are frames 0, 30, 60 and 90,
// 4 of them, and the move is at 91 * 0.38 = 34.6 to 91 * 0.40 = 36.4, inside
// 33 to 57, and fewer messages give fewer than 4 captures. At 147 messages there
// are 142 frames, the captures are frames 0 to 120, 5 of them, and the move is
// at 142 * 0.38 = 54.0 to 142 * 0.40 = 56.8, inside 33 to 57. At 148 messages
// the move may be at 143 * 0.40 = 57.2 and is refused. So a demo gives 4 or 5
// captures: the first 2 from above the water, the rest (2 or 3) from under
// it. The count differs between demos, which is safe because the pin id
// includes the demo checksum, so a demo made again records fresh pins. The
// window tolerates a fraction anywhere from 0.38 to 0.40 over the whole range
// and a move up to 3 frames off the measured place, and the move check decides.
// pins: messages 96 147
// pins: move 33 57
//
// The camera does not walk. noclip takes the player out of physics, and
// teleport puts it at fixed coordinates over and in the large pool of base1,
// where it stays. A teleport also holds the pitch at 0 until a timer runs
// down, and in noclip that timer never runs down, so the view is level with
// the yaw of the level start. Where the camera is and where it looks are
// therefore fixed. god, notarget and noclip are given before record, so
// their console lines are not in the demo.
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w50 "w10;w10;w10;w10;w10"
map base1
// the level loads and the local client connects before anything is recorded
w50
w50
w50
god
notarget
noclip
w50
w50
record water
// the eye some 24 units over the water surface, level
teleport 420 773 -260
w50
w50
w50
w50
w10
w10
// the eye some 24 units under the surface, level
teleport 420 773 -308
w50
w50
w50
w50
w50
w50
w50
w10
w10
stop
quit
