// scripts/pins/demos/water.cfg -- TASK70: records demos/water.dm2, a demo that
// looks at a water surface, for the skywater scenario. Run it with
// scripts/pins.sh make-demo water. The driver copies it beside the binary,
// execs it in a local single-player game and checks the demo it leaves.
// Only commands that exist in src/ may appear here (the driver's selftest
// checks), and no semicolon or quote in a comment: the engine splits on them.
//
// wait holds the rest of this script for one frame of at least 16 ms
// (Cbuf_Execute), so a wait count is a lower bound on time, not a count of
// server frames, and nothing in the engine holds a script for a number of
// server frames. The time at each place, and with it the number of
// messages, therefore grows when the host is slow. The driver checks the
// count against the range below and fails the demo outside it. Inside it a
// skywater record at PINS_EVERY 30 is meant to capture 4 frames, the first 2
// from above the water and the last 2 from under it: the holds are 260 and
// 320 waits, which puts the move under water between the second and the
// third capture, and a longer demo scales both holds alike.
// pins: messages 97 124
//
// The camera does not walk. noclip takes the player out of physics, and
// teleport puts it at fixed coordinates over and in the large pool of base1,
// where it stays. A teleport also holds the pitch at 0 until a timer runs
// down, and in noclip that timer never runs down, so the view is level with
// the yaw of the level start. Where the camera is and where it looks are
// therefore fixed. god, notarget and noclip are given before record, so
// their console lines are not in the demo.
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w50 "w10;w10;w10;w10;w10"
map base1
// the level loads and the local client connects before anything is recorded
w50
w50
w50
god
notarget
noclip
w50
w50
record water
// the eye some 24 units over the water surface, level
teleport 420 773 -260
w50
w50
w50
w50
w50
w10
// the eye some 24 units under the surface, level
teleport 420 773 -308
w50
w50
w50
w50
w50
w50
w10
w10
stop
quit
