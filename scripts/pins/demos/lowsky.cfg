// scripts/pins/demos/lowsky.cfg -- TASK56: records demos/lowsky.dm2, a demo on a map
// whose sky is under 2 % of the world's face area, for the rt-sun scenario's
// skip (a map under the threshold draws as with r_rt_sun 0). Run it with
// scripts/pins.sh make-demo lowsky. The driver copies it beside the binary,
// execs it in a local single-player game and checks the demo it leaves.
// Only commands that exist in src/ may appear here (the driver's selftest
// checks), and no semicolon or quote in a comment: the engine splits on them.
//
// fact2 is the map: ref_metal measures its sky at 0.72 % (242077 of 33701047
// square units, TASK56 review round 1), the largest share under 2 % in the
// game data, so the map has sky faces and only the threshold keeps the sun
// pass off. The player stands at the level start and turns in place
// (+left), so the frames look in every direction from there. god and
// notarget are given before record, so their console lines are not in the
// demo and no monster comes for the player.
//
// A wait holds the rest of this script for one frame of at least 16 ms
// (Cbuf_Execute), so a wait count is a lower bound on time and the number of
// messages grows when the host is slow (see water.cfg). The 900 waits after
// record give some 15 s, about 150 messages on a quiet host. Nothing in the
// scenario depends on the count beyond the number of captures (one every
// PINS_EVERY rendered frames), so the range is wide.
// pins: messages 100 600
alias w10 "wait;wait;wait;wait;wait;wait;wait;wait;wait;wait"
alias w50 "w10;w10;w10;w10;w10"
map fact2
// the level loads and the local client connects before anything is recorded
w50
w50
w50
god
notarget
w50
w50
record lowsky
w50
w50
w50
w50
w50
w50
+left
w50
w50
w50
w50
w50
w50
-left
w50
w50
w50
w50
w50
w50
stop
quit
