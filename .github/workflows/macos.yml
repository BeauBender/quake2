name: Testbuild for MacOS
run-name: testbuild_macos
on:
  push:
    branches:
      - 'main'
  pull_request:
    types:
      - opened
      - synchronize
  schedule:
    # Every night on main: every check of tests/ci-checks.txt, the harness
    # group whole, whatever changed (TASK211).
    - cron: '17 9 * * *'
concurrency:
  # A push to main has one group, so a newer push cancels the main run it
  # supersedes, and no pull request run (TASK211). A pull request has a
  # group of its own number: only its own newer push cancels its run. Any
  # other run (the schedule) has a group of its own run id and is never
  # cancelled. tests/check-ci-map.sh holds this line.
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && 'main' || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
# No token permission unless a job names it.
permissions: {}
jobs:
  build_macos_aarch64:
    runs-on: macos-latest
    permissions:
      # actions/checkout reads the repository. upload-artifact uses the
      # runner's own artifact token, not this one.
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: macos
    steps:
    - name: Install build dependencies
      run: |
        brew update
        brew install make
    - name: Check out repository code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Build
      run: |
        # Public runners come with 3 CPUs.
        gmake -j3
    - name: Static modules
      run: |
        # The STATIC_MODULES=1 client (game and soft renderer linked in, no
        # dylib) against the artifact: otool, nm, strings. SDL is built by
        # the step above. The gate runs the cheaper default of this check.
        tests/check-static-modules.sh --full
    - name: Unit tests
      run: |
        # tests/unit against the q2ded objects; no SDL, no game data.
        gmake -j3 test
    - name: Coverage
      run: |
        # Toolchain-only line coverage; fails below scripts/coverage-floor.
        scripts/coverage.sh
    - name: Create testbuild package
      run: |
        # Create release directory tree
        mkdir -p publish/quake2-macos-${{github.sha}}/misc/docs
        # Copy release assets
        cp -r release/* publish/quake2-macos-${{github.sha}}/
        # Copy misc assets
        cp -r stuff/yq2.cfg publish/quake2-macos-${{github.sha}}/misc/yq2.cfg
        cp -r stuff/models publish/quake2-macos-${{github.sha}}/misc
        cp -r stuff/mapfixes publish/quake2-macos-${{github.sha}}/misc
        cp LICENSE publish/quake2-macos-${{github.sha}}/misc/docs/LICENSE.txt
        cp README.md publish/quake2-macos-${{github.sha}}/misc/docs/README.txt
        cp doc/010_index.md publish/quake2-macos-${{github.sha}}/misc/docs/010_index.txt
        cp doc/020_installation.md publish/quake2-macos-${{github.sha}}/misc/docs/020_installation.txt
        cp doc/030_configuration.md publish/quake2-macos-${{github.sha}}/misc/docs/030_configuration.txt
        cp doc/040_cvarlist.md publish/quake2-macos-${{github.sha}}/misc/docs/040_cvarlist.txt
        cp doc/050_commands.md publish/quake2-macos-${{github.sha}}/misc/docs/050_commands.txt
        cp doc/060_multiplayer.md publish/quake2-macos-${{github.sha}}/misc/docs/060_multiplayer.txt
        cp doc/070_packaging.md publish/quake2-macos-${{github.sha}}/misc/docs/070_packaging.txt
        cp doc/080_contributing.md publish/quake2-macos-${{github.sha}}/misc/docs/080_contributing.txt
        cp doc/085_unittests.md publish/quake2-macos-${{github.sha}}/misc/docs/085_unittests.txt
        cp doc/090_filelists.md publish/quake2-macos-${{github.sha}}/misc/docs/090_filelists.md
    - name: Create tarball package
      run: |
        tar czf quake2-macos.tar.gz -C release .
        cp quake2-macos.tar.gz publish/quake2-macos-${{github.sha}}/
    - name: Upload testbuild package
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: quake2-macos-${{github.sha}}
        path: publish/
        if-no-files-found: error
  invariants_macos:
    # The gate's invariants (tests/check-*.sh, as scripts/test.sh runs them)
    # on free standard runners: the checks in tests/ci-checks.txt, through
    # scripts/ci-checks.sh. tests/ci-local-only.txt names the checks that run
    # on the build host only, each with its reason; tests/check-ci-parity.sh
    # keeps the two lists equal to the checks.
    #
    # Three jobs in parallel (TASK211), the groups of tests/ci-map.txt:
    #   fast     every check that is not in the other two;
    #   harness  the slow self-tests of the harness: on a pull request those
    #            whose path globs match a changed path, and all of them when
    #            a path is in no map entry or is the map, the selector or
    #            under .github/; on a push and the nightly run, all of them;
    #   ios      tests/check-ios.sh: the client, game and ref_metal objects
    #            for the iOS simulator and the device, no SDL, no game data,
    #            no signing, no simulator booted.
    # tests/check-ci-map.sh holds the matrix, the map and the selector.
    strategy:
      matrix:
        group: [fast, harness, ios]
      fail-fast: false # a failing group stops no other
    runs-on: macos-latest
    permissions:
      # actions/checkout reads the repository.
      contents: read
    steps:
    - name: Check out repository code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # The full history: tests/check-cvar-docs.sh reads the upstream base
        # commit and fails on a shallow clone (FIX117).
        fetch-depth: 0
        # The checks need no token after the checkout.
        persist-credentials: false
    - name: Toolchain
      # The Xcode and SDK the checks run with: an older SDK builds the image
      # decoder without kCGImageSourceAllowableTypes (FIX138).
      run: |
        xcodebuild -version; xcrun --show-sdk-version
    - name: Invariants
      env:
        # Public runners come with 3 CPUs.
        GATE_JOBS: 2
        # A skip that this runner must not take fails the check. The image
        # is macOS with Xcode: the iOS simulator and device SDKs (the iOS
        # objects of tests/check-ios.sh were built here before FIX115),
        # python3 (in tests/check-ios.sh's tool list), cc, bash and /bin/ps.
        # The full history (fetch-depth: 0 above) holds the upstream commit
        # that tests/check-cvar-docs-selftest.sh compares against.
        # Not set: the tvOS and visionOS SDKs, a Metal compiler and a Metal
        # device, leaks(1), the VideoToolbox model and a working script(1)
        # pty (CHECK_BENCH_TTY_REQUIRE) are not shown here.
        CHECK_IOS_REQUIRE: 1
        CHECK_EVIDENCE_REQUIRE: 1
        CHECK_AUTORELEASE_POOL_REQUIRE: 1
        CHECK_STATIC_MODULES_REQUIRE: 1
        CHECK_BENCH_REQUIRE: 1
        CHECK_CVAR_DOCS_SELFTEST_REQUIRE: 1
        # The group of tests/ci-map.txt this job runs (TASK211).
        CI_CHECKS_GROUP: ${{ matrix.group }}
      run: |
        scripts/ci-checks.sh
