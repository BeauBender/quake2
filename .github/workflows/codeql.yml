name: "CodeQL"
run-name: CodeQL
on:
  push:
    branches:
      - 'main'
  pull_request:
    types:
      - opened
      - synchronize
concurrency:
  # A pull request has one group, and a newer push to it cancels the run it
  # supersedes. A push to main has a group of its own commit (github.sha),
  # so it is never queued behind, replaced by or cancelled for another run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      analyze: ${{ steps.diff.outputs.analyze }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        # The pull request checkout is a merge commit: HEAD^1 is the base.
        fetch-depth: 2
    - name: Is the change documentation only
      id: diff
      # Every push to main analyses. A pull request skips the analyses only
      # when every changed path is Markdown under doc/ or docs/ or at the
      # top level; anything else, or anything unexpected, analyses. The
      # script prints counts only, never a file name.
      run: bash .github/scripts/codeql-changes.sh
  analyze:
    name: Analyze
    # Runs unless the changes job said false: a failed or missing decision
    # analyses. A skipped matrix job may report under its unexpanded name
    # (plain "Analyze"), not the names of its matrix jobs, so read the real
    # check names from a run before making any of them required.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.analyze != 'false' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
          runner: ubuntu-latest
        - language: c-cpp
          build-mode: manual
          runner: macos-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4.38.0
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
    - name: Build
      if: matrix.build-mode == 'manual'
      run: |
        # Nothing is installed: SDL3 is built from third_party/SDL3 and
        # ref_metal needs only Xcode. CodeQL sees the C files compiled by
        # these targets. ref_gl1 is built twice: against OpenGL, then with
        # the Metal shim (WITH_METAL_SHIM=yes), so both variants are seen.
        # METAL_SHADERS=no skips the .metallib: the hosted runner has Xcode
        # but not the Metal shader compiler, and nothing is installed. The
        # C and Objective-C sources are compiled, the shaders are not
        # (they are not analysed anyway). CodeQL does not analyse
        # Objective-C, so the .m files are not covered.
        make -j4 client server game ref_gl1 ref_gl3 ref_soft ref_metal METAL_SHADERS=no
        make -j4 ref_gl1 WITH_METAL_SHIM=yes METAL_SHADERS=no
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4.38.0
      with:
        category: "/language:${{ matrix.language }}"
  cppcheck:
    name: Cppcheck
    runs-on: ubuntu-latest
    container:
      image: debian:testing
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
    - name: Install build dependencies
      run: |
        apt update
        apt install -y cppcheck
    - name: Check out repository code
      uses: actions/checkout@v7
    - name: Run Cppcheck
      run: |
        cppcheck -j 4 --enable=all --output-format=sarif \
          --output-file=cppcheck_results.sarif --inconclusive --library=posix \
          --suppress=missingIncludeSystem \
          -DYQ2OSTYPE=\"Linux\" src
    - name: Upload SARIF to GitHub Code Scanning
      uses: github/codeql-action/upload-sarif@v4.38.0
      with:
        sarif_file: cppcheck_results.sarif
