name: "CodeQL"
run-name: CodeQL
on:
  push:
    branches:
      - 'main'
  pull_request:
    types:
      - edited
      - opened
      - synchronize
concurrency:
  # Cancel concurrent workflows for the same PR or commit hash.
  group: ${{github.workflow}}-${{github.event_name == 'pull_request' && github.head_ref || github.sha}}
  cancel-in-progress: true
jobs:
  analyze:
    name: Analyze
    runs-on: ${{ matrix.runner }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
          runner: ubuntu-latest
        - language: c-cpp
          build-mode: manual
          runner: macos-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4.38.0
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
    - name: Build
      if: matrix.build-mode == 'manual'
      run: |
        # Nothing is installed: SDL3 is built from third_party/SDL3 and
        # ref_metal needs only Xcode. CodeQL sees the C files compiled by
        # these targets. ref_gl1 is built twice: against OpenGL, then with
        # the Metal shim (WITH_METAL_SHIM=yes), so both variants are seen.
        # METAL_SHADERS=no skips the .metallib: the hosted runner has Xcode
        # but not the Metal shader compiler, and nothing is installed. The
        # C and Objective-C sources are compiled, the shaders are not
        # (they are not analysed anyway). CodeQL does not analyse
        # Objective-C, so the .m files are not covered.
        make -j4 client server game ref_gl1 ref_gl3 ref_soft ref_metal METAL_SHADERS=no
        make -j4 ref_gl1 WITH_METAL_SHIM=yes METAL_SHADERS=no
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4.38.0
      with:
        category: "/language:${{ matrix.language }}"
  cppcheck:
    name: Cppcheck
    runs-on: ubuntu-latest
    container:
      image: debian:testing
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
    - name: Install build dependencies
      run: |
        apt update
        apt install -y cppcheck
    - name: Check out repository code
      uses: actions/checkout@v7
    - name: Run Cppcheck
      run: |
        cppcheck -j 4 --enable=all --output-format=sarif \
          --output-file=cppcheck_results.sarif --inconclusive --library=posix \
          --suppress=missingIncludeSystem \
          -DYQ2OSTYPE=\"Linux\" src
    - name: Upload SARIF to GitHub Code Scanning
      uses: github/codeql-action/upload-sarif@v4.38.0
      with:
        sarif_file: cppcheck_results.sarif
